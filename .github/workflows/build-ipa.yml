# 构建 IPA：通知管理独立控制面板
# 配合 Tweak 使用，共享 NSUserDefaults suiteName 通信
# 推送到 GitHub 自动构建，产物可在 Actions 页面下载
name: build-ipa

on:
  push:
    branches: [ "main" ]
    paths:
      - 'NotifyManagerIPA/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build iOS app (arm64)
        run: |
          set -e
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          echo "iOS SDK: $SDK"

          SRC=NotifyManagerIPA/Source
          RES=NotifyManagerIPA/Resources
          ENT=NotifyManagerIPA/Entitlements

          # 编译所有源文件
          clang -x objective-c -arch arm64 -isysroot "$SDK" \
                -miphoneos-version-min=14.0 -fobjc-arc -fblocks -O2 -fobjc-exceptions \
                -c "$SRC/main.m" -o main.o
          clang -x objective-c -arch arm64 -isysroot "$SDK" \
                -miphoneos-version-min=14.0 -fobjc-arc -fblocks -O2 -fobjc-exceptions \
                -c "$SRC/AppDelegate.m" -o AppDelegate.o
          clang -x objective-c -arch arm64 -isysroot "$SDK" \
                -miphoneos-version-min=14.0 -fobjc-arc -fblocks -O2 -fobjc-exceptions \
                -c "$SRC/StorageManager.m" -o StorageManager.o
          clang -x objective-c -arch arm64 -isysroot "$SDK" \
                -miphoneos-version-min=14.0 -fobjc-arc -fblocks -O2 -fobjc-exceptions \
                -c "$SRC/AppCardView.m" -o AppCardView.o
          clang -x objective-c -arch arm64 -isysroot "$SDK" \
                -miphoneos-version-min=14.0 -fobjc-arc -fblocks -O2 -fobjc-exceptions \
                -c "$SRC/ViewController.m" -o ViewController.o

          echo "=== Compilation done ==="

          # 链接成可执行文件
          clang -arch arm64 -isysroot "$SDK" -fobjc-arc -fobjc-exceptions \
                -framework UIKit -framework Foundation -framework CoreGraphics \
                -framework MobileCoreServices \
                -o NotifyManagerIPA main.o AppDelegate.o StorageManager.o AppCardView.o ViewController.o

          echo "=== Linking done ==="
          file NotifyManagerIPA
          otool -L NotifyManagerIPA

      - name: Create app bundle
        run: |
          set -e
          APP="NotifyManager.app"
          mkdir -p "$APP"

          # 可执行文件
          cp NotifyManagerIPA "$APP/NotifyManagerIPA"

          # Info.plist
          cp NotifyManagerIPA/Resources/Info.plist "$APP/"

          # 图标 — 从现有资源复制
          cp NotifyManager/NotifyManager@2x.png "$APP/AppIcon.png" 2>/dev/null || true
          # 生成占位图标（纯色 60x60）
          if [ ! -f "$APP/AppIcon.png" ]; then
            python3 -c "
import struct, zlib
def create_png(w, h, r, g, b):
    def chunk(ct, data):
        c = ct + data
        return struct.pack('>I', len(data)) + c + struct.pack('>I', zlib.crc32(c) & 0xffffffff)
    raw = b''
    for y in range(h):
        raw += b'\x00' + bytes([r, g, b, 255]) * w
    return b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 6, 0, 0, 0)) + chunk(b'IDAT', zlib.compress(raw)) + chunk(b'IEND', b'')
with open('$APP/AppIcon.png', 'wb') as f:
    f.write(create_png(120, 120, 64, 124, 220))
"
          fi

          # LaunchScreen (从 storyboard 编译)
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          ibtool --compile "$APP/LaunchScreen.nib" NotifyManagerIPA/Resources/LaunchScreen.storyboard \
                 --sdk "$SDK" --target-device ios

          # 签名 — 使用 ldid 注入 TrollStore 兼容 entitlements
          export CODESIGN_ALLOCATE=$(xcrun -f codesign_allocate)
          ldid -SNotifyManagerIPA/Entitlements/NotifyManagerIPA.entitlements "$APP/NotifyManagerIPA"

          echo "=== App bundle created ==="
          find "$APP" -type f

      - name: Package IPA
        run: |
          set -e
          mkdir -p Payload
          cp -R NotifyManager.app Payload/
          # 压缩成 IPA
          zip -r NotifyManagerIPA.ipa Payload/
          echo "=== IPA created ==="
          ls -lh NotifyManagerIPA.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: NotifyManagerIPA
          path: NotifyManagerIPA.ipa

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: NotifyManagerIPA.ipa
          name: 通知管理控制面板 ${{ github.ref_name }}