name: build-ipa

on:
  push:
    branches: [ "main" ]
    paths:
      - 'NotifyManagerIPA/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build iOS app (arm64)
        run: |
          set -e
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          echo "iOS SDK: $SDK"
          SRC=NotifyManagerIPA/Source
          for f in main.m AppDelegate.m StorageManager.m AppCardView.m ViewController.m; do
            clang -x objective-c -arch arm64 -isysroot "$SDK" \
                  -miphoneos-version-min=14.0 -fobjc-arc -fblocks -O2 -fobjc-exceptions \
                  -c "$SRC/$f" -o "${f%.m}.o"
          done
          clang -arch arm64 -isysroot "$SDK" -fobjc-arc -fobjc-exceptions \
                -framework UIKit -framework Foundation -framework CoreGraphics \
                -framework MobileCoreServices -framework QuartzCore \
                -framework UniformTypeIdentifiers \
                -o NTMApp main.o AppDelegate.o StorageManager.o AppCardView.o ViewController.o
          file NTMApp
          otool -L NTMApp

      - name: Create app bundle
        run: |
          set -e
          APP="NotifyManager.app"
          mkdir -p "$APP"
          cp NTMApp "$APP/NotifyManagerIPA"
          cp NotifyManagerIPA/Resources/Info.plist "$APP/"
          if [ -f NotifyManager/NotifyManager@2x.png ]; then
            cp NotifyManager/NotifyManager@2x.png "$APP/AppIcon.png"
          else
            python3 NotifyManagerIPA/gen_icon.py "$APP/AppIcon.png"
          fi
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          ibtool --compile "$APP/LaunchScreen.nib" \
                 NotifyManagerIPA/Resources/LaunchScreen.storyboard \
                 --sdk "$SDK" --target-device ios
          export CODESIGN_ALLOCATE=$(xcrun -f codesign_allocate)
          ldid -SNotifyManagerIPA/Entitlements/NotifyManagerIPA.entitlements "$APP/NotifyManagerIPA"
          echo "=== App bundle ==="
          find "$APP" -type f

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R NotifyManager.app Payload/
          zip -r NotifyManagerIPA.ipa Payload/
          ls -lh NotifyManagerIPA.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: NotifyManagerIPA
          path: NotifyManagerIPA.ipa

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: NotifyManagerIPA.ipa
          name: 通知管理控制面板 ${{ github.ref_name }}