name: build-tweak

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install ldid + dpkg
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
          HOMEBREW_NO_ENV_HINTS: 1
          HOMEBREW_NO_REQUIRE_TAP_TRUST: 1
        run: |
          brew install ldid dpkg || true

      - name: "Compile BatteryPanel PreferenceBundle (arm64+arm64e)"
        run: |
          set -e
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          echo "iOS SDK: $SDK"
          for arch in arm64 arm64e; do
            clang -x objective-c -arch "$arch" -isysroot "$SDK" -miphoneos-version-min=15.0 \
                  -fobjc-arc -fblocks -O2 -fobjc-exceptions \
                  -c batteryanalyzer/BatteryPanel.m -o "BatteryPanel_${arch}.o"
            clang -dynamiclib -arch "$arch" -isysroot "$SDK" -miphoneos-version-min=15.0 \
                  -fobjc-exceptions -Wl,-undefined,dynamic_lookup \
                  -framework UIKit -framework Foundation -framework QuartzCore -framework CoreGraphics \
                  -install_name "@rpath/BatteryPanel.dylib" \
                  -o "BatteryPanel_${arch}.dylib" "BatteryPanel_${arch}.o"
          done
          lipo -create BatteryPanel_arm64.dylib BatteryPanel_arm64e.dylib -output BatteryPanel.dylib
          file BatteryPanel.dylib
          lipo -info BatteryPanel.dylib

      - name: "Compile Tweak.dylib (SpringBoard hook, arm64+arm64e)"
        run: |
          set -e
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          for arch in arm64 arm64e; do
            clang -x objective-c -arch "$arch" -isysroot "$SDK" -miphoneos-version-min=15.0 \
                  -fobjc-arc -fblocks -O2 -fobjc-exceptions \
                  -c batteryanalyzer/Tweak.m -o "Tweak_${arch}.o"
            clang -dynamiclib -arch "$arch" -isysroot "$SDK" -miphoneos-version-min=15.0 \
                  -fobjc-exceptions -Wl,-undefined,dynamic_lookup \
                  -framework UIKit -framework Foundation \
                  -install_name "@rpath/BatteryAnalyzerTweak.dylib" \
                  -o "Tweak_${arch}.dylib" "Tweak_${arch}.o"
          done
          lipo -create Tweak_arm64.dylib Tweak_arm64e.dylib -output Tweak.dylib
          file Tweak.dylib
          lipo -info Tweak.dylib

      - name: "Re-sign with FakeSIGNER entitlement"
        run: |
          ldid -Sbatteryanalyzer/entitlements.plist BatteryPanel.dylib
          ldid -Sbatteryanalyzer/entitlements.plist Tweak.dylib
          codesign -dvvv BatteryPanel.dylib 2>&1 || true
          codesign -dvvv Tweak.dylib 2>&1 || true
          otool -L BatteryPanel.dylib
          otool -L Tweak.dylib

      - name: "Package deb (rootless: TweakInject + PreferenceBundles + PreferenceLoader)"
        run: |
          set -e
          VERSION=$(sed -n 's/^Version:[ ]*//p' batteryanalyzer/control)
          BUNDLE=batteryanalyzer/BatteryPanel.bundle
          mkdir -p "$BUNDLE"
          cp BatteryPanel.dylib "$BUNDLE/BatteryPanel"
          cp batteryanalyzer/Info.plist "$BUNDLE/Info.plist"
          mkdir -p stage/DEBIAN
          # TweakInject: Tweak.dylib + plist
          mkdir -p "stage/var/jb/usr/lib/TweakInject"
          cp Tweak.dylib "stage/var/jb/usr/lib/TweakInject/BatteryAnalyzerTweak.dylib"
          cp batteryanalyzer/Tweak.plist "stage/var/jb/usr/lib/TweakInject/BatteryAnalyzerTweak.plist"
          # PreferenceBundles
          mkdir -p "stage/var/jb/Library/PreferenceBundles"
          cp -R "$BUNDLE" "stage/var/jb/Library/PreferenceBundles/"
          # PreferenceLoader
          mkdir -p "stage/var/jb/Library/PreferenceLoader/Preferences"
          cp batteryanalyzer/BatteryPanel.plist "stage/var/jb/Library/PreferenceLoader/Preferences/BatteryPanel.plist"
          # control
          sed "s/^Version:.*/Version: $VERSION/" batteryanalyzer/control > stage/DEBIAN/control
          printf '\n' >> stage/DEBIAN/control
          chmod 755 stage/DEBIAN/control
          dpkg-deb --root-owner-group -b stage BatteryAnalyzer.deb
          echo "=== deb layout ==="
          dpkg-deb -c BatteryAnalyzer.deb

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: BatteryAnalyzer-deb
          path: BatteryAnalyzer.deb
