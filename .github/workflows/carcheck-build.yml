name: Build CarCheckPlugin

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'CarCheckPlugin/**'
      - '.github/workflows/carcheck-build.yml'

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Download SDK
        run: |
          mkdir -p $HOME/theos/sdks
          curl -L -o /tmp/iPhoneOS16.5.sdk.zip \
            "https://github.com/nicedayzhu/iosjailbreak_dev/releases/download/v1.0/iPhoneOS16.5.sdk.zip"
          unzip -q -o /tmp/iPhoneOS16.5.sdk.zip -d $HOME/theos/sdks/
          ls -la $HOME/theos/sdks/

      - name: Build
        run: |
          export THEOS=$HOME/theos
          cd CarCheckPlugin
          make clean
          make package FINALPACKAGE=1

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: CarCheckPlugin
          path: CarCheckPlugin/packages/*.deb

      - name: Upload DYLIB
        uses: actions/upload-artifact@v4
        with:
          name: CarCheckPlugin-dylib
          path: CarCheckPlugin/.theos/obj/debug/*.dylib