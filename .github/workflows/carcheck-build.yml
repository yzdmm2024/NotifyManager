name: Build CarCheckPlugin

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'CarCheckPlugin/**'
      - '.github/workflows/carcheck-build.yml'

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Download SDK
        run: |
          mkdir -p $HOME/theos/sdks
          # Theos 官方 SDK 下载脚本
          python3 $HOME/theos/vendor/ta/scripts/fetch_sdks.py 2>&1 || true
          ls -la $HOME/theos/sdks/ 2>/dev/null
          # 如果 SDK 目录为空，尝试另一个源
          if [ ! -d "$HOME/theos/sdks/iPhoneOS16.5.sdk" ]; then
            echo "Trying alternative SDK download..."
            curl -sL -o /tmp/sdk.tar.xz \
              "https://github.com/nicedayzhu/iosjailbreak_dev/releases/download/v1.0/sdks.tar.xz"
            if [ -f /tmp/sdk.tar.xz ] && [ -s /tmp/sdk.tar.xz ]; then
              tar -xf /tmp/sdk.tar.xz -C $HOME/theos/ 2>/dev/null || true
            fi
          fi
          ls -la $HOME/theos/sdks/ 2>/dev/null
          echo "SDK check done"

      - name: Install ldid
        run: |
          brew install ldid 2>/dev/null || {
            # 直接下载预编译 ldid
            curl -sL -o /tmp/ldid "https://github.com/nicedayzhu/iosjailbreak_dev/releases/download/v1.0/ldid"
            chmod +x /tmp/ldid
            sudo cp /tmp/ldid /usr/local/bin/ldid
          }
          which ldid || echo "ldid not found"

      - name: Build
        run: |
          export THEOS=$HOME/theos
          cd CarCheckPlugin
          make clean
          make package FINALPACKAGE=1

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: CarCheckPlugin
          path: CarCheckPlugin/packages/*.deb

      - name: Upload DYLIB
        uses: actions/upload-artifact@v4
        with:
          name: CarCheckPlugin-dylib
          path: CarCheckPlugin/.theos/obj/debug/*.dylib