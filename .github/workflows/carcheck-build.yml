name: Build CarCheckPlugin

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'CarCheckPlugin/**'
      - '.github/workflows/carcheck-build.yml'

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Download SDK
        run: |
          mkdir -p $HOME/theos/sdks
          # 尝试使用 Theos 官方 SDK 下载脚本
          python3 $HOME/theos/vendor/ta/scripts/fetch_sdks.py --no-tco 2>/dev/null || true
          # 如果还没有，下载 iPhoneOS 16.5 SDK
          if [ ! -f "$HOME/theos/sdks/iPhoneOS16.5.sdk/SDKSettings.json" ]; then
            curl -sL -o /tmp/sdk.zip \
              "https://github.com/nicedayzhu/iosjailbreak_dev/releases/download/v1.0/iPhoneOS16.5.sdk.zip"
            if [ -f /tmp/sdk.zip ] && [ -s /tmp/sdk.zip ]; then
              unzip -q -o /tmp/sdk.zip -d $HOME/theos/sdks/ 2>/dev/null || true
            fi
          fi
          ls -la $HOME/theos/sdks/ 2>/dev/null || echo "SDK dir empty"

      - name: Build
        run: |
          export THEOS=$HOME/theos
          cd CarCheckPlugin
          make clean
          make package FINALPACKAGE=1

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: CarCheckPlugin
          path: CarCheckPlugin/packages/*.deb

      - name: Upload DYLIB
        uses: actions/upload-artifact@v4
        with:
          name: CarCheckPlugin-dylib
          path: CarCheckPlugin/.theos/obj/debug/*.dylib