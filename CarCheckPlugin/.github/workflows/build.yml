name: Build CarCheckPlugin

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'CarCheckPlugin/**'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          # 下载 SDK
          $HOME/theos/vendor/ta/scripts/fetch_sdks.py
          # 如果 SDK 下载失败，使用缓存
          if [ ! -d "$HOME/theos/sdks" ] || [ -z "$(ls -A $HOME/theos/sdks)" ]; then
            echo "SDK目录为空，尝试下载缓存..."
            curl -L -o /tmp/sdks.tar.xz \
              "https://github.com/nicedayzhu/iosjailbreak_dev/releases/download/v1.0/sdks.tar.xz"
            tar -xf /tmp/sdks.tar.xz -C $HOME/theos/
          fi
          ls -la $HOME/theos/sdks/

      - name: Build
        run: |
          export THEOS=$HOME/theos
          cd CarCheckPlugin
          make clean
          make package FINALPACKAGE=1

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: CarCheckPlugin
          path: CarCheckPlugin/packages/*.deb

      - name: Upload DYLIB
        uses: actions/upload-artifact@v4
        with:
          name: CarCheckPlugin-dylib
          path: CarCheckPlugin/.theos/obj/debug/*.dylib